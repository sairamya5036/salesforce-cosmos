<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">CasePulse AI — The SLA Rescue Console</title><desc id="desc">A navy and teal project banner illustrating explainable SLA risk and approved case rescue.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071626"/><stop offset="1" stop-color="#123c49"/></linearGradient><linearGradient id="accent"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93c5fd" stroke-opacity=".05"/></pattern></defs>
<rect width="1400" height="440" rx="24" fill="url(#bg)"/><rect width="1400" height="440" rx="24" fill="url(#grid)"/>
<circle cx="1220" cy="80" r="210" fill="#2dd4bf" opacity=".04"/>
<g font-family="Arial,Helvetica,sans-serif"><rect x="64" y="58" width="248" height="30" rx="15" fill="#163e48" stroke="#2dd4bf" stroke-opacity=".3"/><text x="83" y="78" fill="#8ce6d8" font-size="12" letter-spacing="2">SALESFORCE HEADLESS 360</text>
<text x="62" y="168" fill="#f8fafc" font-size="66" font-weight="700" letter-spacing="-2">CasePulse <tspan fill="url(#accent)">AI</tspan></text>
<text x="66" y="215" fill="#d2e6ed" font-size="27">The SLA Rescue Console</text>
<text x="66" y="266" fill="#9bb5c3" font-size="18">Rescue critical customer cases before they</text><text x="66" y="293" fill="#9bb5c3" font-size="18">become customer escalations.</text>
<text x="66" y="368" fill="#77d8c9" font-size="13" letter-spacing="2">EXPLAINABLE RISK  /  HUMAN APPROVAL  /  SHARED MCP</text>
<g transform="translate(812 66)"><rect width="510" height="310" rx="20" fill="#0d2235" stroke="#355467"/><circle cx="28" cy="29" r="5" fill="#2dd4bf"/><text x="44" y="34" fill="#afc9d5" font-size="12" letter-spacing="1">TEAM SLA COMMAND CENTER</text><path d="M24 54H486" stroke="#264354"/>
<rect x="24" y="76" width="140" height="64" rx="10" fill="#36252f"/><text x="40" y="103" fill="#fca5a5" font-size="23" font-weight="700">CRITICAL</text><text x="40" y="125" fill="#b5a4af" font-size="11">Act before escalation</text>
<rect x="180" y="76" width="306" height="64" rx="10" fill="#123b40"/><polyline points="196,112 224,112 238,98 251,127 269,88 286,113 310,113 327,104 350,104 364,113 468,113" fill="none" stroke="#5eead4" stroke-width="3"/>
<text x="24" y="181" fill="#e2edf3" font-size="17" font-weight="700">One case. Clear reasons. A next step.</text><text x="24" y="209" fill="#89a8bb" font-size="13">Milestone deadline · Response age · Reopens</text><rect x="24" y="241" width="180" height="40" rx="9" fill="#2dd4bf"/><text x="48" y="266" fill="#072c35" font-size="14" font-weight="700">Prepare rescue →</text><text x="225" y="266" fill="#9bb5c3" font-size="12">You approve the change.</text></g></g></svg>
